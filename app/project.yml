# The Xcode project for the Apple apps, for XcodeGen (`brew install xcodegen`). Three apps share
# DSNKit, the local Swift package next to this file: macOS (Sources/DSNative), iOS and iPadOS
# (Sources/DSNativeiOS), tvOS (Sources/DSNativeTV).
#
# Not meant to be generated by hand: tools/build_app.py writes the xcconfig this reads (the game,
# its names, where libdsn.a is for each SDK), runs XcodeGen and then xcodebuild. The project it
# makes (OUTDIR/xcode/DSNative.xcodeproj) opens in Xcode for running on a device: pick your team
# under Signing & Capabilities.
#
#   DSN_XCCONFIG       environment variable: path of the xcconfig (build_app.py sets it)
#   DSN_PACKAGE_PATH   environment variable: this directory, absolute (XcodeGen writes a local
#                      package's path as given, so a project made elsewhere can't use a relative one)
#   settings it defines: DSN_APP_NAME, DSN_PRODUCT_NAME, DSN_BUNDLE_ID, DSN_GAME_CODE,
#     DSN_GAME_TITLE, DSN_SAVE_TYPE, DSN_ROM, DSN_ARM9, and LIBRARY_SEARCH_PATHS per SDK
name: DSNative
options:
  bundleIdPrefix: com.dsnative
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: ${DSN_XCCONFIG}
  Release: ${DSN_XCCONFIG}
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: $(DSN_PRODUCT_NAME)
    PRODUCT_BUNDLE_IDENTIFIER: $(DSN_BUNDLE_ID)
    # the script below copies the game into the bundle, outside Xcode's sandbox for scripts
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    # libdsn.a is arm64 only (build_app.py builds it so)
    ARCHS: arm64
packages:
  DSNKit:
    path: ${DSN_PACKAGE_PATH}
targets:
  DSNative-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/DSNative
      # precompiled into the bundle's default.metallib (the package has the source as well, for a run-time fallback)
      - path: Sources/DSNKit/Shaders
    dependencies:
      - package: DSNKit
        product: DSNKit
    settings:
      base:
        INFOPLIST_FILE: ${DSN_PACKAGE_PATH}/Support/Info-macOS.plist
    postBuildScripts: &bundle-game
      - name: Bundle the game
        basedOnDependencyAnalysis: false
        script: |
          set -e
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${dest}"
          cp -f "${DSN_ROM}" "${dest}/game.nds"
          cp -f "${DSN_ARM9}" "${dest}/arm9.bin"
  DSNative-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/DSNativeiOS
      - path: Sources/DSNKit/Shaders
    dependencies:
      - package: DSNKit
        product: DSNKit
    settings:
      base:
        INFOPLIST_FILE: ${DSN_PACKAGE_PATH}/Support/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts: *bundle-game
  DSNative-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources/DSNativeTV
      - path: Sources/DSNKit/Shaders
    dependencies:
      - package: DSNKit
        product: DSNKit
    settings:
      base:
        INFOPLIST_FILE: ${DSN_PACKAGE_PATH}/Support/Info-tvOS.plist
    postBuildScripts: *bundle-game
